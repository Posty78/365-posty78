<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>Navigation - 1500 Macdo</title>
  <link rel="icon" type="image/svg+xml" href="./favicon-nav.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    /* --- Nav commune 365.posty78.fr --- */
    #hub-nav{
      position:sticky; top:0; z-index:2000;
      display:flex; align-items:center; justify-content:space-between;
      gap:12px; height:52px; padding:0 20px;
      background:rgba(10,10,10,0.95); backdrop-filter:blur(10px);
      border-bottom:1px solid rgba(255,255,255,0.08);
      font-family:'Inter',system-ui,sans-serif;
    }
    #hub-nav .brand{
      display:flex; align-items:center; gap:8px;
      font-weight:800; font-size:15px; text-decoration:none; color:#f2f2f2;
    }
    #hub-nav .brand .dot{width:7px;height:7px;border-radius:50%;background:#00cc44;box-shadow:0 0 4px rgba(0,204,68,0.6);}
    #hub-nav .tabs{display:flex; gap:4px; overflow-x:auto;}
    #hub-nav .tabs a{
      font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.4px;
      padding:6px 13px; border-radius:999px; white-space:nowrap;
      text-decoration:none; color:#e4e6ea;
    }
    #hub-nav .tabs a.active{background:#00cc44; color:#031a0a;}
    @media (max-width:640px){
      #hub-nav{
        flex-direction: column;
        align-items: stretch;
        height: auto;
        padding: 8px 12px;
        gap: 6px;
      }
      #hub-nav .brand{ font-size:13px; justify-content:center; }
      #hub-nav .tabs{
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 4px;
        overflow-x: visible;
        width: 100%;
      }
      #hub-nav .tabs a{
        text-align: center;
        padding: 6px 4px;
        font-size: 10px;
      }
    }

    :root {
      --bg: #0a0a0a;
      --green: #00cc44;
      --white: #ffffff;
      --muted: #557755;
      --font: "Inter", system-ui, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--bg); }
    body {
      font-family: var(--font);
      color: var(--white);
      min-height: calc(100vh - 52px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      gap: 24px;
    }

    h1 {
      font-size: 18px;
      font-weight: 700;
      color: var(--green);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .counter {
      font-size: 48px;
      font-weight: 900;
      font-family: monospace;
      color: var(--white);
    }

    .counter span { color: var(--green); }

    .mcdo-name {
      font-size: 28px;
      font-weight: 800;
      color: var(--white);
      text-align: center;
      text-transform: uppercase;
    }

    .mcdo-coords {
      font-size: 13px;
      color: var(--muted);
      font-family: monospace;
    }

    .closed-warning {
      display: none;
      width: 100%;
      max-width: 400px;
      background: rgba(239,68,68,0.12);
      border: 2px solid #ef4444;
      border-radius: 14px;
      padding: 14px 16px;
      text-align: center;
      gap: 10px;
      flex-direction: column;
    }
    .closed-warning.is-visible { display: flex; }
    .closed-warning__text {
      color: #ff8080;
      font-weight: 700;
      font-size: 14px;
    }
    .closed-warning__skip {
      height: 44px;
      background: #ef4444;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      max-width: 400px;
      height: 64px;
      background: var(--green);
      color: #000;
      font-size: 18px;
      font-weight: 800;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      text-decoration: none;
    }

    .btn-waze {
      background: #33ccff;
      color: #000;
    }

    .btn-row {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 400px;
    }

    .btn-prev-next {
      display: flex;
      gap: 12px;
      width: 100%;
      max-width: 400px;
    }

    .btn-prev, .btn-next {
      flex: 1;
      height: 52px;
      background: rgba(0,204,68,0.1);
      border: 2px solid var(--green);
      border-radius: 12px;
      color: var(--green);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .next-info {
      font-size: 13px;
      color: var(--muted);
      text-align: center;
    }

    .next-info span { color: var(--white); font-weight: 600; }
  </style>
</head>
<body>

<nav id="hub-nav">
  <a class="brand" href="/"><span class="dot"></span>365 · POSTY78</a>
  <div class="tabs">
    <a href="/maps/" class="active">Maps</a>
    <a href="/giveaway/">Giveaway</a>
    <a href="/recompense/">Récompense</a>
    <a href="/seance/">Séance</a>
    <a href="/poids/">Poids</a>
    <a href="/alimentation/">Alimentation</a>
  </div>
</nav>

  <h1>🍟 Navigation 1500 Macdo</h1>

  <div class="counter">
    <span id="current-num">-</span> / 1500
  </div>

  <div class="mcdo-name" id="mcdo-name">Chargement...</div>
  <div class="mcdo-coords" id="mcdo-coords"></div>

  <div class="closed-warning" id="closed-warning">
    <span class="closed-warning__text">⚠️ Ce Macdo est fermé définitivement</span>
    <button class="closed-warning__skip" onclick="go(+1)">Passer au suivant →</button>
  </div>

  <div class="btn-row">
    <a id="btn-gmaps" class="btn-nav" href="#" target="_blank">
      🗺️ Google Maps
    </a>
    <a id="btn-waze" class="btn-nav btn-waze" href="#" target="_blank">
      🚗 Waze
    </a>
  </div>

  <div class="btn-prev-next">
    <button class="btn-prev" onclick="go(-1)">← Précédent</button>
    <button class="btn-next" onclick="go(+1)">Suivant →</button>
  </div>

  <div class="next-info">
    Prochain : <span id="next-name">-</span>
  </div>

<script>
  // Points confirmes fermes definitivement (audit du 22/08/2026) : McDo reel a cette
  // adresse, mais plus en activite. On avertit avant d'y envoyer, sans les retirer du
  // parcours (ce sont de vrais arrets historiques du trace).
  const CLOSED_IDS = new Set(["MC0162", "MC0410"]);

  // Compteur prive, independant du systeme public (project/status.currentMcdo) :
  // navigue librement ici sans jamais affecter ce que voient les viewers sur la carte.
  let mcdo = [];
  let index = parseInt(localStorage.getItem('mcdo-index') || '0');

  fetch('./assets/mcdo_1500_points.geojson')
    .then(r => r.json())
    .then(data => {
      mcdo = data.features;
      render();
    });

  function render() {
    if (!mcdo.length) return;
    const f = mcdo[index];
    const next = mcdo[index + 1];
    const [lon, lat] = f.geometry.coordinates;
    const name = f.properties.name || `McDo #${index + 1}`;

    document.getElementById('current-num').textContent = index + 1;
    document.getElementById('mcdo-name').textContent = name;
    document.getElementById('mcdo-coords').textContent = `${lat.toFixed(5)}, ${lon.toFixed(5)}`;

    document.getElementById('btn-gmaps').href =
      `https://www.google.com/maps/dir/?api=1&destination=${lat},${lon}&travelmode=driving`;

    document.getElementById('btn-waze').href =
      `https://waze.com/ul?ll=${lat},${lon}&navigate=yes`;

    document.getElementById('next-name').textContent =
      next ? (next.properties.name || `McDo #${index + 2}`) : 'ARRIVÉE ! 🏆';

    document.getElementById('closed-warning').classList.toggle(
      'is-visible', CLOSED_IDS.has(f.properties.id)
    );
  }

  function go(dir) {
    const newIndex = index + dir;
    if (newIndex < 0 || newIndex >= mcdo.length) return;
    index = newIndex;
    localStorage.setItem('mcdo-index', index);
    render();
  }
</script>

</body>
</html>
